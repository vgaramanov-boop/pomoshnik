<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #b3261e; color: #fff; font: 14px "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .b { display: flex; align-items: center; height: 100%; padding: 0 8px 0 14px; gap: 10px; }
  .d { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: k 1.2s infinite; }
  @keyframes k { 50% { opacity: .25; } }
  span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; font: inherit; font-weight: 600; background: #fff; color: #b3261e; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="b"><i class="d"></i><span>К компьютеру подключён: <b id="n"></b></span><button id="x">Отключить</button></div>
<script src="banner.js"></script>
</body>
</html>
